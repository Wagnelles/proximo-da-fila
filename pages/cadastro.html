<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cadastro de obra | Próximo da fila</title>

    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <header class="cabecalho">
        <h1 class="titulo">Próximo da fila</h1>

        <p class="subtitulo">
            Descubra o que assistir em seguida!
        </p>

        <nav class="navegacao">
            <a href="../index.html">Início</a>
            <a href="cadastro.html">Cadastro</a>
            <a href="consulta.html">Consulta</a>
        </nav>
    </header>

    <main class="conteudo">

        <section class="introducao">
            <h2>Cadastrar nova obra</h2>

            <p>
                Preencha as informações da obra audiovisual e informe
                sua experiência pessoal com ela.
            </p>
        </section>

        <section class="formulario-cadastro">

            <form>

                <fieldset>
                    <legend>Informações da obra</legend>

                    <p>
                        <label for="titulo">Título:</label>

                        <input
                            type="text"
                            id="titulo"
                            name="titulo"
                            required
                        >
                    </p>

                    <p>
                        <label for="tipo">Tipo:</label>

                        <select id="tipo" name="tipo" required>
                            <option value="">Selecione um tipo</option>
                            <option value="filme">Filme</option>
                            <option value="serie">Série</option>
                            <option value="documentario">Documentário</option>
                            <option value="animacao">Animação</option>
                            <option value="curta-metragem">
                                Curta-metragem
                            </option>
                            <option value="outro">Outro</option>
                        </select>
                    </p>

                    <p>
                        <label for="generos">Gêneros:</label>

                        <input
                            type="text"
                            id="generos"
                            name="generos"
                            placeholder="Exemplo: ação, aventura, comédia"
                            required
                        >
                    </p>

                    <p>
                        <label for="ano-lancamento">
                            Ano de lançamento:
                        </label>

                        <input
                            type="number"
                            id="ano-lancamento"
                            name="ano-lancamento"
                            min="1888"
                            max="2100"
                            required
                        >
                    </p>

                    <p>
                        <label for="elenco">Elenco:</label>

                        <textarea
                            id="elenco"
                            name="elenco"
                            rows="4"
                            placeholder="Informe os nomes do elenco principal"
                        ></textarea>
                    </p>

                    <p>
                        <label for="avaliacao-geral">
                            Avaliação geral:
                        </label>

                        <input
                            type="number"
                            id="avaliacao-geral"
                            name="avaliacao-geral"
                            min="0"
                            max="10"
                            step="0.1"
                        >
                    </p>

                    <p>
                        <label for="imagem">Imagem:</label>

                        <input
                            type="file"
                            id="imagem"
                            name="imagem"
                            accept="image/png, image/jpeg"
                        >
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Informações pessoais</legend>

                    <p>
                        <label for="status">Status:</label>

                        <select id="status" name="status" required>
                            <option value="">Selecione um status</option>
                            <option value="quero-assistir">
                                Quero assistir
                            </option>
                            <option value="assistindo">
                                Assistindo
                            </option>
                            <option value="assistido">
                                Assistido
                            </option>
                        </select>
                    </p>

                    <p>
                        <label for="avaliacao-pessoal">
                            Avaliação pessoal:
                        </label>

                        <input
                            type="number"
                            id="avaliacao-pessoal"
                            name="avaliacao-pessoal"
                            min="0"
                            max="10"
                            step="0.1"
                        >
                    </p>

                    <p>
                        <label for="observacoes">Observações:</label>

                        <textarea
                            id="observacoes"
                            name="observacoes"
                            rows="6"
                            placeholder="Escreva suas observações sobre a obra"
                        ></textarea>
                    </p>
                </fieldset>

                <p>
                    <button type="submit">Cadastrar obra</button>
                    <button type="reset">Limpar formulário</button>
                </p>

            </form>

        </section>

    </main>

<footer class="rodape">

    <section class="signature">
    <p>PUC Minas - SWE</p>
    <p>Wagnelles@2026</p>
    </section>

    <nav class="navegacao">
        <a href="https://github.com/Wagnelles/proximo-da-fila">
                Github
        </a>

    <section class="btw">
        Made on Arch Linux (btw)
    </section>


</footer>

</body>

</html>
