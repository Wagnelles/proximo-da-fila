<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cadastro de obra | Próximo da fila</title>

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/cadastro.css?v=2">
    <script src="../assets/js/script.js?v=6" defer></script>

</head>

<body>

    <header class="cabecalho">
        <h1 class="titulo">Próximo da fila</h1>

        <p class="subtitulo">
            Descubra o que assistir em seguida!
        </p>

        <nav class="navegacao">
            <a href="../index.html">Início</a>
            <a href="cadastro.html">Cadastro</a>
            <a href="consulta.html">Consulta</a>
        </nav>
    </header>

    <main class="conteudo">

        <section class="introducao">
            <h2>Cadastrar nova obra</h2>

            <p>
                Preencha as informações da obra audiovisual e informe
                sua experiência pessoal com ela.
            </p>
        </section>

        <section class="formulario-cadastro">

            <form id="corpo-cadastro">

                <fieldset>
                    <legend>Informações da obra</legend>

                    <p>
                        <label for="input-titulo">Título:</label>

                        <input id="input-titulo"
                            type="text"
                            name="titulo"
                        >

                        <button type="button" id="botao-buscar-api">Buscar na API</button>
                    </p>

                    <div id="sugestoes-api"></div>

                    <p>
                        <label for="input-tipo-da-midia">Tipo:</label>

                        <select id="input-tipo-da-midia" name="tipo">
                            <option value="">Selecione um tipo</option>
                            <option value="filme">Filme</option>
                            <option value="serie">Série</option>
                            <option value="documentario">Documentário</option>
                            <option value="animacao">Animação</option>
                            <option value="curta-metragem">Curta-metragem</option>
                            <option value="outro">Outro</option>
                        </select>
                    </p>

                    <p>
                        <label for="input-genero">Gênero:</label>

                        <select id="input-genero" name="genero">
                            <option value="">Selecione o gênero</option>
                            <option value="acao">Ação</option>
                            <option value="animacao">Animação</option>
                            <option value="aventura">Aventura</option>
                            <option value="comedia">Comédia</option>
                            <option value="documentario">Documentário</option>
                            <option value="drama">Drama</option>
                            <option value="ficcao-cientifica">Ficção científica</option>
                            <option value="romance">Romance</option>
                            <option value="suspense">Suspense</option>
                            <option value="terror">Terror</option>
                        </select>
                    </p>

                    <p>
                        <label for="input-ano-lancamento">
                            Ano de lançamento:
                        </label>

                        <input id="input-ano-lancamento"
                            type="number"
                            name="ano-lancamento"
                            min="1888"
                            max="2100"
                        >
                    </p>

                    <p>
                        <label for="input-elenco">Elenco:</label>

                        <textarea
                            id="input-elenco"
                            name="elenco"
                            rows="4"
                            placeholder="Informe os nomes do elenco principal"
                        ></textarea>
                    </p>

                    <p>
                        <label for="input-avaliacao-geral">
                            Avaliação geral:
                        </label>

                        <input
                            type="number"
                            id="input-avaliacao-geral"
                            name="avaliacao-geral"
                            min="0"
                            max="10"
                            step="0.1"
                        >
                    </p>

                    <p>
                        <label for="input-imagem">Imagem (URL da capa):</label>

                        <input
                            type="url"
                            id="input-imagem"
                            name="imagem"
                            placeholder="Preenchido pela busca ou cole o link da imagem"
                        >
                    </p>

                    <img id="preview-capa" src="" alt="Prévia da capa" hidden>
                </fieldset>

                <fieldset>
                    <legend>Informações pessoais</legend>

                    <p>
                        <label for="input-infopessoal-status">Status:</label>

                        <select id="input-infopessoal-status" name="status">
                            <option value="">Selecione um status</option>
                            <option value="quero-assistir">
                                Quero assistir
                            </option>
                            <option value="assistindo">
                                Assistindo
                            </option>
                            <option value="assistido">
                                Assistido
                            </option>
                        </select>
                    </p>

                    <p>
                        <label for="input-infopessoal-avaliacao-pessoal">
                            Nota pessoal:
                        </label>

                        <input
                            type="number"
                            id="input-infopessoal-avaliacao-pessoal"
                            name="avaliacao-pessoal"
                            min="0"
                            max="10"
                            step="0.1"
                        >
                    </p>

                    <p>
                        <label for="input-infopessoal-observacoes">Observações:</label>

                        <textarea
                            id="input-infopessoal-observacoes"
                            name="observacoes"
                            rows="6"
                            placeholder="Escreva suas observações sobre a obra"
                        ></textarea>
                    </p>
                </fieldset>

                <p>
                    <button id="botao-salvar" type="submit">Cadastrar obra</button>
                    <button type="reset">Limpar formulário</button>
                </p>

                <p class="alertas" id="alertas"></p>

            </form>

        </section>

    </main>

<footer class="rodape">

    <section class="signature">
    <p>PUC Minas - SWE</p>
    <p>Wagnelles@2026</p>
    </section>

    <nav class="navegacao">
        <a class="a1" href="https://github.com/Wagnelles/proximo-da-fila">
                Github
        </a>

        <a class="a2"> Made on Arch Linux (btw)</a>

    </nav>


</footer>

</body>

</html>
